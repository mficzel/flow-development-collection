name: build

on:
  workflow_dispatch:
  push:
    branches: [ master, '[0-9]+.[0-9]' ]
  pull_request:
    branches: [ master, '[0-9]+.[0-9]' ]

permissions: {}

env:
  FLOW_CONTEXT: Testing
  FLOW_DIST_FOLDER: flow-development-distribution
  FLOW_FOLDER: flow-development-collection

jobs:
  static-analysis:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Static analysis (PHP ${{ matrix.php }})"
    # Static analysis is informational only and must not block the build (was experimental before).
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: ${{ env.FLOW_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-flow` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-flow
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}

      - name: Static analysis
        run: cd Packages/Framework && composer lint

  unit-tests:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Unit tests (PHP ${{ matrix.php }}, deps: ${{ matrix.dependencies || 'highest' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          # Build for minimum dependencies.
          - php: '8.0'
            dependencies: 'lowest'
    services:
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      memcached:
        image: memcached:alpine
        ports:
          - "11211:11211"
    defaults:
      run:
        working-directory: ${{ env.FLOW_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-flow` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-flow
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}

      - name: Run unit tests
        run: composer test-unit -- --verbose

  functional-tests:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Functional tests (PHP ${{ matrix.php }}, ${{ matrix.db.engine }}, deps: ${{ matrix.dependencies || 'highest' }})"
    runs-on: ubuntu-latest
    # Bleeding-edge engines (MariaDB 12.2 / PostgreSQL 18) are allowed to fail.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        db:
          - { engine: mysql, image: 'mariadb:10.6', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' }
          - { engine: pgsql, image: 'postgres:14-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' }
        include:
          # Build for minimum dependencies (both base engines).
          - { php: '8.0', dependencies: 'lowest', db: { engine: mysql, image: 'mariadb:10.6', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.0', dependencies: 'lowest', db: { engine: pgsql, image: 'postgres:14-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' } }
          # MySQL engines.
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.0', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.4', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          # Bleeding-edge engines (experimental).
          - { php: '8.5', experimental: true, db: { engine: mysql, image: 'mariadb:12.2', port: 3306, options: '--health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.5', experimental: true, db: { engine: pgsql, image: 'postgres:18-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' } }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_USER: neos
          MYSQL_PASSWORD: neos
          MYSQL_DATABASE: flow_functional_testing
          MYSQL_ROOT_PASSWORD: neos
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos
          POSTGRES_DB: flow_functional_testing
        ports:
          - "${{ matrix.db.port }}:${{ matrix.db.port }}"
        options: ${{ matrix.db.options }}
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      memcached:
        image: memcached:alpine
        ports:
          - "11211:11211"
    defaults:
      run:
        working-directory: ${{ env.FLOW_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-flow` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-flow
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}

      - name: Configure database
        run: |
          rm -f Configuration/Routes.yaml Configuration/Testing/Settings.yaml
          cat > Configuration/Testing/Settings.yaml <<EOF
          Neos:
            Flow:
              persistence:
                backendOptions:
                  host: '127.0.0.1'
                  port: ${{ matrix.db.port }}
                  dbname: 'flow_functional_testing'
          EOF
          if [ "${{ matrix.db.engine }}" = "pgsql" ]; then
            cat >> Configuration/Testing/Settings.yaml <<EOF
                  driver: pdo_pgsql
                  user: 'neos'
                  password: 'neos'
                  charset: 'utf8'
                  defaultTableOptions:
                    charset: 'utf8'
          EOF
          else
            cat >> Configuration/Testing/Settings.yaml <<EOF
                  driver: pdo_mysql
                  user: 'root'
                  password: 'neos'
          EOF
          fi
          cat >> Configuration/Testing/Settings.yaml <<EOF
              mvc:
                routes:
                  'Neos.Flow': TRUE
          EOF
          echo "Running in context '$FLOW_CONTEXT'"
          ./flow configuration:show
          ./flow routing:list

      - name: Run functional tests
        run: composer test-func -- --verbose

  behavioral-tests:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Behavioral tests (PHP ${{ matrix.php }}, ${{ matrix.db.engine }})"
    runs-on: ubuntu-latest
    # Bleeding-edge engines (MariaDB 12.2 / PostgreSQL 18) are allowed to fail.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        db:
          - { engine: mysql, image: 'mariadb:10.6', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' }
          - { engine: pgsql, image: 'postgres:14-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' }
        include:
          # MySQL engines.
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.0', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.4', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          # Bleeding-edge engines (experimental).
          - { php: '8.5', experimental: true, db: { engine: mysql, image: 'mariadb:12.2', port: 3306, options: '--health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.5', experimental: true, db: { engine: pgsql, image: 'postgres:18-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' } }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_USER: neos
          MYSQL_PASSWORD: neos
          MYSQL_DATABASE: flow_functional_testing
          MYSQL_ROOT_PASSWORD: neos
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos
          POSTGRES_DB: flow_functional_testing
        ports:
          - "${{ matrix.db.port }}:${{ matrix.db.port }}"
        options: ${{ matrix.db.options }}
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      memcached:
        image: memcached:alpine
        ports:
          - "11211:11211"
    defaults:
      run:
        working-directory: ${{ env.FLOW_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-flow` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-flow
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}

      - name: Configure database
        run: |
          rm -f Configuration/Routes.yaml Configuration/Testing/Settings.yaml
          cat > Configuration/Testing/Settings.yaml <<EOF
          Neos:
            Flow:
              persistence:
                backendOptions:
                  host: '127.0.0.1'
                  port: ${{ matrix.db.port }}
                  dbname: 'flow_functional_testing'
          EOF
          if [ "${{ matrix.db.engine }}" = "pgsql" ]; then
            cat >> Configuration/Testing/Settings.yaml <<EOF
                  driver: pdo_pgsql
                  user: 'neos'
                  password: 'neos'
                  charset: 'utf8'
                  defaultTableOptions:
                    charset: 'utf8'
          EOF
          else
            cat >> Configuration/Testing/Settings.yaml <<EOF
                  driver: pdo_mysql
                  user: 'root'
                  password: 'neos'
          EOF
          fi
          cat >> Configuration/Testing/Settings.yaml <<EOF
              mvc:
                routes:
                  'Neos.Flow': TRUE
          EOF
          echo "Running in context '$FLOW_CONTEXT'"
          ./flow configuration:show
          ./flow routing:list

      - name: Run behat tests
        run: |
          FLOW_CONTEXT=Testing/Behat ./flow doctrine:migrate
          FLOW_CONTEXT=Testing/Behat ./flow behat:setup
          bin/behat --stop-on-failure -f progress -c Packages/Framework/Neos.Flow/Tests/Behavior/behat.yml.dist

  buildall:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    name: CI build (matrix)
    needs: [unit-tests, functional-tests, behavioral-tests]
    steps:
      - name: Check matrix status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
